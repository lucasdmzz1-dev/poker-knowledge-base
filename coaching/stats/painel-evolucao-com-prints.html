<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Evolução — Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE0;--card:#FFFFFF;--ink:#1E1A12;--soft:#6B6450;--rule:#E3DCC5;--good:#2F7D55;--warn:#A86F12;--bad:#A23D2B;--gold:#B08D3D;--track:#E8E0C8;--band:rgba(47,125,85,.25);--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F211B;--card:#17302A;--ink:#F1EAD6;--soft:#A9A08A;--rule:#2A4A40;--good:#5FB587;--warn:#D9A441;--bad:#E08672;--gold:#D9B45A;--track:#22403A;--band:rgba(95,181,135,.3)}}
:root[data-theme="dark"]{--bg:#0F211B;--card:#17302A;--ink:#F1EAD6;--soft:#A9A08A;--rule:#2A4A40;--good:#5FB587;--warn:#D9A441;--bad:#E08672;--gold:#D9B45A;--track:#22403A;--band:rgba(95,181,135,.3)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:40px 18px 64px}
.wrap{max-width:860px;margin:0 auto}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 10px}
.sub{color:var(--soft);font-size:15px;line-height:1.55;margin:0 0 26px;max-width:62ch}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.tile b{display:block;font-family:var(--serif);font-size:34px;font-weight:500}
.tile span{font-size:13px;color:var(--soft)}
.tile.good b{color:var(--good)}.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--bad)}
.trendline{font-size:14px;color:var(--soft);margin:0 0 6px}
.trendline b{color:var(--ink)}
h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:34px 0 14px}
.weeks{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:4px 18px}
.wrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.wrow:last-child{border-bottom:0}
.wrow b{font-weight:600}
.wrow input{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.wrow .txt{color:var(--ink)}
.wbtns{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h3{margin:0;font-size:16px;font-weight:600}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.vals{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--soft);align-items:baseline}
.vals b{font-size:18px;color:var(--ink);font-weight:600}
.vals small{font-size:11px;opacity:.85}
.tr{margin-left:auto;font-weight:600;font-size:12.5px}
.tr.up{color:var(--good)}.tr.dn{color:var(--bad)}.tr.eq{color:var(--soft)}
.gauge{position:relative;height:10px;border-radius:999px;background:var(--track);margin:6px 4px 4px}
.band{position:absolute;top:0;bottom:0;background:var(--band);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--ink);background:var(--card)}
.dot.d2{background:var(--ink)}.dot.d3{background:var(--gold);border-color:var(--gold)}
.tgt{font-size:13px;margin:0;color:var(--ink)}
.tgt span{color:var(--soft)}
.note{font-size:13px;color:var(--soft);line-height:1.5;margin:0}
.ins{display:flex;flex-wrap:wrap;gap:10px 14px;border-top:1px solid var(--rule);padding-top:10px;margin-top:2px}
.ins label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft)}
.ins input{width:76px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin:18px 0 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:5px}
.legend i.f{background:var(--ink)}.legend i.g{background:var(--gold);border-color:var(--gold)}
.foot{margin-top:34px;font-size:12.5px;color:var(--soft);line-height:1.6}
@media(max-width:520px){.sum{gap:8px}.tile{padding:12px}.tile b{font-size:26px}.wrow{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr)}.wrow .chip{grid-column:2/-1;justify-self:start}}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.msg{font-size:13.5px;margin:6px 0 0;min-height:20px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}

.mode{display:flex;gap:8px;margin:0 0 18px}
.mode button{font:inherit;font-size:14px;padding:8px 22px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.mode button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pw{grid-column:1/-1}
.pwin{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.pwh h3{margin:0 0 4px;font-size:16px;font-weight:600}.pwh p{margin:0 0 12px;font-size:13px;color:var(--soft);line-height:1.5}
.ptabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.ptabs button{font:inherit;font-size:13.5px;padding:6px 16px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.ptabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ptabs small{opacity:.7;margin-left:3px}
.pcols{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.pcol{flex:1 0 150px;min-width:150px;max-width:240px;border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--bg)}
.pcol.tg{outline:2px dashed var(--gold);outline-offset:-2px}
.pcol.dr{background:var(--band)}
.pcl{font-size:13px;margin:0 0 8px;color:var(--soft)}.pcl b{color:var(--ink);font-size:14px}.pcl em{font-style:normal;color:var(--gold);font-weight:600;font-size:11.5px;margin-left:4px}
.pth{position:relative;margin:0 0 8px}.pth img{width:100%;display:block;border-radius:8px;border:1px solid var(--rule);cursor:zoom-in}
.px{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.pask{position:absolute;inset:0;background:rgba(0,0,0,.72);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:13px}
.pask button{font:inherit;font-size:12.5px;padding:4px 14px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;margin:0 3px}
.padd{display:block;border:1px dashed var(--rule);border-radius:8px;padding:10px 6px;text-align:center;font-size:13px;color:var(--soft);cursor:pointer}
.pact{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.phint{font-size:12.5px;color:var(--soft)}
.pwarn{font-size:12.5px;color:var(--bad);margin:8px 0 0}
.pov{position:fixed;inset:0;background:rgba(8,12,10,.97);z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pov[hidden]{display:none}
.povin{width:100%;max-width:1300px;max-height:100%;display:flex;flex-direction:column;gap:10px;color:#F1EAD6}
.povh{display:flex;align-items:center;gap:14px;font-size:14px}.povh .btn{margin-left:auto}
.povb{display:flex;align-items:center;gap:8px;min-height:0}
.povb img{max-width:calc(100% - 90px);max-height:calc(100vh - 120px);object-fit:contain;margin:0 auto;display:block}
.nv{font-size:30px;width:44px;height:64px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
.cmpg{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto}
.cmpc{display:flex;flex-direction:column;gap:8px;min-width:0}
.cmpc select{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.cmpc img{width:100%;border-radius:8px;display:block}
@media(max-width:700px){.cmpg{grid-template-columns:1fr}.povb img{max-width:calc(100% - 60px)}.nv{width:30px}}
.t3{border-top:1px solid var(--rule);padding-top:8px}
.t3h{font-size:13px;margin:0 0 6px;color:var(--soft)}.t3h b{color:var(--ink)}
.t3g{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.t3g label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--soft)}
.t3g input{width:100%;padding:5px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
.t3s{font-size:13px;margin-top:6px;color:var(--soft)}.t3s b{color:var(--ink)}
.expt{width:100%;min-height:50vh;max-height:70vh;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.cbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.32);background:transparent;color:#F1EAD6;cursor:pointer}
.cchip.on{background:#F1EAD6;color:#10201a;border-color:#F1EAD6}
.czoom,.cpre{display:flex;gap:6px;align-items:center;font-size:12.5px}.czoom span{opacity:.8}
.cmpscroll{display:flex;gap:14px;overflow:auto;align-items:flex-start;flex:1;min-height:0;padding-bottom:8px}
.cmpcol{flex:none;display:flex;flex-direction:column;gap:8px}
.cmph{font-size:13.5px;font-weight:600;color:#F1EAD6}.cmph small{opacity:.7;font-weight:400}
.cmpcol img{width:100%;border-radius:8px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel de evolução</h1>
  <div class="mode" id="modetabs"><button data-m="w" class="on">Semanal</button><button data-m="m">Mensal</button></div>

  <div class="wbtns"><button class="btn pri" id="save">Salvar</button><button class="btn" id="reopen">Reabrir</button><button class="btn" id="exp">Exportar resumo</button></div>

  <div class="legend" id="legend"></div>

</div>

    }
    var cv=V[m.n]&&V[m.n][cj+nb];
    var ins='<label>'+c.pre+(cj+nb+1)+' <input type="number" step="0.1" inputmode="decimal" data-n="'+esc(m.n)+'" data-w="'+(cj+nb)+'" placeholder="%" value="'+(typeof cv==='number'?cv:'')+'"></label>';
    if(m.g!==lastG){if(lastG)html+='</div>';html+='<h2>'+m.g+'</h2><div class="grid">';lastG=m.g}
    html+='<article class="card"><div class="top"><h3>'+m.n+(m.src?' <small style="font-weight:400;font-size:12px;color:var(--soft)">· '+m.src+'</small>':'')+'</h3><span class="chip '+st+'">'+lab+'</span></div>'
     +'<div class="vals">'+row+tr+'</div>'+t3h
     +'<div class="gauge"><div class="band" style="left:'+l+'%;width:'+Math.max(r-l,1.5)+'%"></div>'+dots+'</div>'
     +'<p class="tgt"><span>Meta:</span> '+tgtText(m)+'</p>'+(m.cp?'<p class="tgt"><span>'+(m.cpl||'Metas S3–S6')+':</span> '+m.cp+'</p>':'')+'<p class="note">'+m.note+'</p>'
     +'<div class="ins">'+ins+'</div></article>';
    if(mode==='w'&&m.n==='Call open — SB')html+='<div class="pw" id="pw-slot"></div>';
  });
  html+='</div>';
  document.getElementById('root').innerHTML=html;
  drawPrints();
  document.querySelectorAll('.t3i').forEach(function(el){el.addEventListener('change',function(){var ps=el.dataset.p,k=el.dataset.k,v=parseFloat(String(el.value).replace(',','.'));T3[ps]=T3[ps]||{};if(isNaN(v))delete T3[ps][k];else T3[ps][k]=v;sv('painel:t3',T3);render()})});
  document.getElementById('sub').textContent=c.sub;
  document.getElementById('wtitle').textContent=c.title;
  document.getElementById('legend').innerHTML=c.leg;
  document.getElementById('foot').textContent=c.foot;
  document.getElementById('weeks').innerHTML=weeksHtml(c,X);
  var emptyW=!X[cj].d&&typeof X[cj].h!=='number'&&!MX.some(function(m){return V[m.n]&&typeof V[m.n][cj+nb]==='number'});
  document.getElementById('save').textContent='Salvar '+c.pre+(cj+nb+1)+' e ir para '+c.art+' '+c.pre+(cj+nb+2);
  var ro=document.getElementById('reopen');ro.textContent='Reabrir '+c.un+' anterior';ro.disabled=!(cj>0&&emptyW);
  document.getElementById('sum').innerHTML='<div class="tile good"><b>'+cnt.good+'</b><span>No alvo</span></div><div class="tile warn"><b>'+cnt.warn+'</b><span>Perto</span></div><div class="tile bad"><b>'+cnt.bad+'</b><span>Longe</span></div>';
  document.getElementById('trend').innerHTML='Desde a medição anterior: <b>'+imp+' melhoraram</b> · <b>'+wor+' pioraram</b>.';
  document.querySelectorAll('#modetabs button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode)});
  document.querySelectorAll('.ins input').forEach(function(el){el.addEventListener('change',function(){var nm=el.dataset.n,k=el.dataset.w,v=parseFloat(String(el.value).replace(',','.'));V[nm]=V[nm]||{};if(isNaN(v))delete V[nm][k];else V[nm][k]=v;sv(c.vk,V);render()})});
  document.querySelectorAll('.wd').forEach(function(el){el.addEventListener('change',function(){X[+el.dataset.k].d=el.value.trim();sv(c.wk,X);render()})});
  document.querySelectorAll('.wh').forEach(function(el){el.addEventListener('change',function(){var n=parseInt(el.value,10);X[+el.dataset.k].h=isNaN(n)?null:n;sv(c.wk,X);render()})});
}
document.getElementById('modetabs').addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('button'):null;
  if(!b||!b.dataset.m)return;mode=b.dataset.m;render();
});
document.getElementById('save').addEventListener('click',function(){
  var c=CFG[mode],S=ST[mode],X=S.X,V=S.V,nb=c.nb,j=cw(X),x=X[j],mg=document.getElementById('msg'),miss=[];
  if(!c.dre.test(x.d||''))miss.push(c.dmiss);
  if(typeof x.h!=='number'||x.h<=0)miss.push('a quantidade de mãos');
  if(!c.M.some(function(m){return V[m.n]&&typeof V[m.n][j+nb]==='number'}))miss.push('pelo menos um valor nos cards');
  if(miss.length){mg.className='msg err';mg.textContent='Falta preencher: '+miss.join(', ')+'.';return}
  x.c=true;X.push({d:'',h:null,c:false});sv(c.wk,X);
  render();
  mg=document.getElementById('msg');mg.className='msg ok';mg.textContent=c.pre+(j+nb+1)+' salv'+(c.art==='a'?'a':'o')+'. Agora você está '+(c.art==='a'?'na ':'no ')+c.pre+(j+nb+2)+'.';
  window.scrollTo(0,0);
});
document.getElementById('reopen').addEventListener('click',function(){
  var c=CFG[mode],X=ST[mode].X,j=cw(X);if(j<1||document.getElementById('reopen').disabled)return;
  X.pop();X[X.length-1].c=false;sv(c.wk,X);render();
  var mg=document.getElementById('msg');mg.className='msg ok';mg.textContent='Reaberto para edição.';
});
document.getElementById('exp').addEventListener('click',openExp);
render();
dbOpen();
</script>
</body>
</html>
